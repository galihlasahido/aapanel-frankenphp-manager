	/* header */
	.fp-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #fff; border-bottom: 1px solid #eceff2; }
	.fp-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
	.fp-app-name { font-size: 15px; font-weight: 600; color: #111827; }
	.fp-app-version { font-size: 12px; color: #9ca3af; }
	.fp-status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px; }
	.fp-status-pill.run { background: #e7f7ee; color: #1a7f4f; }
	.fp-status-pill.stop { background: #fdeceb; color: #c0362c; }
	.fp-status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
	.fp-header-actions .btn { margin-right: 6px; }

	/* tabs */
	.fp-tabs { display: flex; gap: 4px; padding: 0 20px; background: #fff; border-bottom: 1px solid #eceff2; }
	.fp-tab { padding: 10px 14px; font-size: 13px; font-weight: 500; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
	.fp-tab:hover { color: #1f2937; }
	.fp-tab.active { color: #2f6feb; border-bottom-color: #2f6feb; }
	.fp-tab-count { display: inline-block; background: #eef1f5; color: #6b7280; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; margin-left: 4px; }
	.fp-tab.active .fp-tab-count { background: #e3edff; color: #2f6feb; }

	.fp-tab-panel { padding: 18px 20px 22px; }

	/* stat cards */
	.fp-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
	.fp-card { flex: 1 1 140px; background: #fff; border: 1px solid #eceff2; border-radius: 8px; padding: 14px 16px; min-width: 130px; }
	.fp-card-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
	.fp-card-value { font-size: 20px; font-weight: 700; color: #111827; line-height: 1.2; }
	.fp-card-sub { font-size: 11px; color: #9ca3af; margin-top: 3px; }

	.fp-section-title { font-size: 13px; font-weight: 600; color: #374151; margin: 4px 0 10px; }
	.fp-box { background: #fff; border: 1px solid #eceff2; border-radius: 8px; padding: 16px; }

	.fp-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #9ca3af; background: #fafbfc; padding: 9px 12px; border-bottom: 1px solid #eceff2; }

	.fp-table td.fp-actions { white-space: nowrap; word-break: normal; text-align: right; }

	.fp-health-dot.down { background: #c0362c; }

	.fp-geo-controls button { width: 28px; height: 28px; line-height: 26px; padding: 0; border-radius: 6px; border: 1px solid #d7dee8; background: #fff; color: #374151; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

	.fp-install-desc { font-size: 13px; color: #6b7280; line-height: 1.7; max-width: 460px; margin: 0 auto 18px; }

<script>
	function fpApplyModalSize($layerEl, ratio, minW, minH) {
		if (!$layerEl || !$layerEl.length) return;
		var w = Math.max(minW || 0, Math.round($(window).width() * ratio));
		var h = Math.max(minH || 0, Math.round($(window).height() * ratio));
		$layerEl.width(w).height(h);
		$layerEl.css({
			left: Math.max(0, Math.round(($(window).width() - w) / 2)) + 'px',
			top: Math.max(0, Math.round(($(window).height() - h) / 2)) + 'px'
		});
	}
	fpApplyModalSize($('#fp_plugin').closest('.layui-layer'), 0.95, 700, 400);

	// layer.js aapanel cuma auto-resize modal kalau area diisi tinggi eksplisit; pemanggil kita
	// sering pakai tinggi 'auto', jadi modal position:fixed bisa jatuh di luar viewport tanpa
	// scroll sama sekali. Helper ini dipakai untuk modal utama (via setTimeout, timing di luar
	// kendali kita) maupun dialog yang kita buka sendiri (via callback success layer.js).
	function fpFixLayerBox($layerEl) {
		if (!$layerEl || !$layerEl.length) return;
		var modalH = parseFloat($layerEl.css('height')) || Math.round($(window).height() * 0.95);
		$layerEl.css({ 'max-height': modalH + 'px', 'overflow': 'hidden' });
		var titleH = $layerEl.find('.layui-layer-title').outerHeight() || 0;
		// height (bukan cuma max-height) supaya #fp_plugin/.fp-shell yang pakai height:100%
		// bisa resolve dan background-nya (bukan putih polos punya layer.js) ikut memenuhi
		// modal walau konten tab yang lagi aktif pendek (mis. tab Domain vs Dashboard).
		var contentH = Math.max(120, modalH - titleH - 4);
		$layerEl.find('.layui-layer-content').css({ 'height': contentH + 'px', 'max-height': contentH + 'px', 'overflow-y': 'auto' });
	}
	setTimeout(function () { fpFixLayerBox($('#fp_plugin').closest('.layui-layer')); }, 50);
	$(window).off('resize.fpPlugin').on('resize.fpPlugin', function () {
		var $l = $('#fp_plugin').closest('.layui-layer');
		fpApplyModalSize($l, 0.95, 700, 400);
		fpFixLayerBox($l);
	});

	function fpAjaxGet(s, cb) { $.get('/plugin?action=a&name=frankenphp&s=' + s, cb); }
	function fpAjaxPost(s, data, cb) { $.post('/plugin?action=a&s=' + s + '&name=frankenphp', data, cb); }

	function fpInit() {
		fpAjaxGet('GetLang', function (l) {
			fpLang = (l && l.lang) || 'en';
			fpAjaxGet('CheckInstalled', function (d) {
				if (d.installed) { fpState = d; fpRenderManage(); } else { fpRenderInstall(); }
			});
		});
	}

	function fpSetLang(lang) {
		fpAjaxPost('SetLang', { lang: lang }, function () {
			fpLang = lang;
			fpAjaxGet('CheckInstalled', function (d) {
				if (d.installed) { fpState = d; fpRenderManage(); } else { fpRenderInstall(); }
			});
		});
	}

	function fpLangSwitcherHtml() {
		return '<select class="fp-select" id="fp_lang_switcher" style="width:auto;max-width:110px;padding:4px 8px;font-size:12px;" onchange="fpSetLang(this.value)">' +
			'<option value="en"' + (fpLang === 'en' ? ' selected' : '') + '>English</option>' +
			'<option value="id"' + (fpLang === 'id' ? ' selected' : '') + '>Bahasa Indonesia</option>' +
			'</select>';
	}

	// ---------------- install screen ----------------

	var fpPhpVersionLabels = {
		'latest': 'Terbaru (PHP 8.5.x)',
		'8.4': 'PHP 8.4 (FrankenPHP v1.10.1)',
		'8.3': 'PHP 8.3 (FrankenPHP v1.2.5, rilis lama)',
		'custom': 'Custom (build dari source - versi PHP bebas)'
	};
	var fpSpcExtCache = null;

	function fpRenderInstall() {
		var versionOptions = Object.keys(fpPhpVersionLabels).map(function (v) {
			return '<option value="' + v + '"' + (v === 'latest' ? ' selected' : '') + '>' + fpEsc(fpPhpVersionLabels[v]) + '</option>';
		}).join('');
		var html = '' +
			'<div style="text-align:right;padding:8px 12px 0;">' + fpLangSwitcherHtml() + '</div>' +
			'<div class="fp-install-card">' +
			'<div class="fp-install-icon">Fp</div>' +
			'<div style="font-size:15px;font-weight:600;margin-bottom:8px;">' + fpT('not_installed_title') + '</div>' +
			'<div class="fp-install-desc">' + fpT('plugin_desc') + '</div>' +
			'<div style="margin:14px 0;text-align:left;max-width:420px;margin-left:auto;margin-right:auto;">' +
			'<div class="fp-form-label" style="margin-bottom:4px;">' + fpT('php_version_label') + '</div>' +
			'<select class="fp-select" id="fp_install_php_version" style="width:100%;">' + versionOptions + '</select>' +
			'<div class="fp-hint" style="margin-top:6px;">' + fpT('php_version_pick_hint') + '</div>' +
			'<div id="fp_install_custom_box" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid #eceff2;">' +
			'<div class="fp-form-label" style="margin-bottom:4px;">' + fpT('php_version_example_label') + '</div>' +
			'<input class="fp-input" id="fp_install_custom_version" placeholder="8.2" style="width:100%;margin-bottom:10px;">' +
			'<div class="fp-form-label" style="margin-bottom:4px;">' + fpT('extension') + '</div>' +
			'<div style="margin-bottom:6px;">' +
			'<span class="fp-hint">static-php-cli: <b id="fp_spc_version_label">...</b></span> ' +
			'<button type="button" class="btn btn-default btn-sm" id="fp_spc_refresh_toggle">' + fpT('update_ext_list') + '</button>' +
			'</div>' +
			'<div id="fp_spc_refresh_box" style="display:none;margin-bottom:10px;padding:8px;border:1px solid #eceff2;border-radius:6px;background:#fafbfc;">' +
			'<div class="fp-hint" style="margin-bottom:6px;">' + fpT('spc_update_hint') + '</div>' +
			'<input class="fp-input" id="fp_spc_new_version" placeholder="2.8.5" style="max-width:150px;display:inline-block;"> ' +
			'<button type="button" class="btn btn-primary btn-sm" id="fp_spc_refresh_btn">' + fpT('refresh') + '</button>' +
			'<div id="fp_spc_refresh_result" style="margin-top:6px;"></div>' +
			'</div>' +
			'<div style="margin-bottom:6px;">' +
			'<button type="button" class="btn btn-default btn-sm" id="fp_ext_recommended">' + fpT('select_common') + '</button> ' +
			'<button type="button" class="btn btn-default btn-sm" id="fp_ext_all">' + fpT('select_all') + '</button> ' +
			'<button type="button" class="btn btn-default btn-sm" id="fp_ext_none">' + fpT('clear') + '</button>' +
			'</div>' +
			'<div id="fp_ext_checks" class="fp-method-checks" style="max-height:220px;overflow-y:auto;border:1px solid #eceff2;border-radius:6px;padding:8px;"><div class="fp-hint">' + fpT('loading_extensions') + '</div></div>' +
			'<div class="fp-form-label" style="margin-top:10px;margin-bottom:4px;">' + fpT('gh_token_label') + '</div>' +
			'<div class="fp-hint" style="margin-bottom:6px;">' + fpT('gh_token_full_hint') + '</div>' +
			'<div style="margin-bottom:10px;">' +
			'<span class="fp-hint">' + fpT('token_status_label') + ' <b id="fp_gh_token_status">...</b></span> ' +
			'<input class="fp-input" id="fp_gh_token_input" type="password" placeholder="ghp_xxxxxxxxxxxx" style="max-width:220px;display:inline-block;"> ' +
			'<button type="button" class="btn btn-default btn-sm" id="fp_gh_token_save">' + fpT('save') + '</button> ' +
			'<button type="button" class="btn btn-default btn-sm" id="fp_gh_token_remove">' + fpT('delete_') + '</button>' +
			'</div>' +
			'<div class="fp-hint" style="margin-top:6px;">' + fpT('build_source_full_hint') + '</div>' +
			'</div>' +
			'</div>' +
			'<button class="btn btn-success btn-sm" onclick="fpStartInstall()" id="fp_install_btn">' + fpT('install_franken_title') + '</button>' +
			'<div id="fp_install_status" class="fp-hint"></div>' +
			'</div>';
		$('#fp_plugin').html(html);

		$('#fp_install_php_version').change(function () {
			var isCustom = $(this).val() === 'custom';
			$('#fp_install_custom_box').toggle(isCustom);
			if (isCustom && !fpSpcExtCache) fpLoadSpcExtensions();
			if (isCustom) fpLoadGithubTokenStatus();
		});
		$('#fp_gh_token_save').click(function () {
			var token = $('#fp_gh_token_input').val().trim();
			if (!token) { layer.msg(fpT('fill_token_first'), { icon: 2 }); return; }
			fpAjaxPost('SetGithubToken', { token: token }, function (r) {
				layer.msg(r.msg, { icon: r.status ? 1 : 2 });
				if (r.status) { $('#fp_gh_token_input').val(''); fpLoadGithubTokenStatus(); }
			});
		});
		$('#fp_gh_token_remove').click(function () {
			fpAjaxPost('RemoveGithubToken', {}, function (r) {
				layer.msg(r.msg, { icon: r.status ? 1 : 2 });
				fpLoadGithubTokenStatus();
			});
		});
		$('#fp_ext_recommended').click(function () {
			var rec = (fpSpcExtCache && fpSpcExtCache.recommended) || [];
			$('#fp_ext_checks input').each(function () { this.checked = rec.indexOf(this.value) !== -1; });
		});
		$('#fp_ext_all').click(function () { $('#fp_ext_checks input').prop('checked', true); });
		$('#fp_ext_none').click(function () { $('#fp_ext_checks input').prop('checked', false); });
		$('#fp_spc_refresh_toggle').click(function () {
			$('#fp_spc_refresh_box').toggle();
			if (!$('#fp_spc_new_version').val()) $('#fp_spc_new_version').val((fpSpcExtCache && fpSpcExtCache.spc_version) || '');
		});
		$('#fp_spc_refresh_btn').click(fpRefreshSpcExtensions);
	}

	function fpLoadSpcExtensions() {
		fpAjaxGet('GetSpcExtensionOptions', function (r) {
			if (!r.status) { $('#fp_ext_checks').html('<div class="fp-hint">' + fpT('fetch_ext_failed_prefix') + fpEsc(r.msg) + '</div>'); return; }
			fpSpcExtCache = r;
			$('#fp_spc_version_label').text(r.spc_version || '?');
			var recommended = r.recommended || [];
			var html = (r.extensions || []).map(function (e) {
				return '<label><input type="checkbox" value="' + fpEsc(e) + '"' + (recommended.indexOf(e) !== -1 ? ' checked' : '') + '> ' + fpEsc(e) + '</label>';
			}).join('');
			$('#fp_ext_checks').html(html);
		});
	}

	function fpRefreshSpcExtensions() {
		var version = $('#fp_spc_new_version').val().trim();
		if (!version) { layer.msg(fpT('fill_spc_version_first'), { icon: 2 }); return; }
		var $btn = $('#fp_spc_refresh_btn').prop('disabled', true).text(fpT('loading'));
		$('#fp_spc_refresh_result').html('<span class="fp-hint">' + fpT('fetching_ext_from') + fpEsc(version) + '...</span>');
		fpAjaxPost('RefreshSpcExtensions', { spc_version: version }, function (r) {
			$btn.prop('disabled', false).text(fpT('refresh'));
			$('#fp_spc_refresh_result').html('<span class="fp-hint">' + fpEsc(r.msg) + '</span>');
			if (r.status) {
				fpSpcExtCache = { status: true, spc_version: version, extensions: r.extensions, recommended: r.recommended };
				$('#fp_spc_version_label').text(version);
				var html = r.extensions.map(function (e) {
					return '<label><input type="checkbox" value="' + fpEsc(e) + '"' + (r.recommended.indexOf(e) !== -1 ? ' checked' : '') + '> ' + fpEsc(e) + '</label>';
				}).join('');
				$('#fp_ext_checks').html(html);
			}
		});
	}

	function fpLoadGithubTokenStatus() {
		fpAjaxGet('GetGithubTokenStatus', function (r) {
			$('#fp_gh_token_status').text(r.status && r.set ? fpT('saved') : fpT('not_set'));
		});
	}

	function fpStartInstall() {
		var phpVersion = $('#fp_install_php_version').val() || 'latest';
		var data = { php_version: phpVersion };
		var startMsg = fpT('starting_install_prefix') + (fpPhpVersionLabels[phpVersion] || phpVersion) + ')...\n';

		if (phpVersion === 'custom') {
			var customVersion = $('#fp_install_custom_version').val().trim();
			var exts = $('#fp_ext_checks input:checked').map(function () { return this.value; }).get();
			if (!customVersion) { layer.msg(fpT('fill_php_version_first'), { icon: 2 }); return; }
			if (!exts.length) { layer.msg(fpT('pick_min_1_ext'), { icon: 2 }); return; }
			// static-php-cli tolak build kalau swoole-hook-X dan pdo_X yg disediakan hook itu
			// sama-sama aktif (lihat validasi identik di backend Install()) - dicek di sini juga
			// supaya user langsung tahu tanpa harus tunggu build 15-40 menit lalu gagal.
			var conflictPairs = [['swoole-hook-pgsql', 'pdo_pgsql'], ['swoole-hook-sqlite', 'pdo_sqlite'], ['swoole-hook-odbc', 'pdo_odbc']];
			for (var ci = 0; ci < conflictPairs.length; ci++) {
				var hook = conflictPairs[ci][0], pdo = conflictPairs[ci][1];
				if (exts.indexOf(hook) !== -1 && exts.indexOf(pdo) !== -1) {
					layer.msg(fpT('ext_conflict').replace('{hook}', hook).replace('{pdo}', pdo), { icon: 2 });
					return;
				}
			}
			data.custom_php_version = customVersion;
			data.extensions = exts.join(',');
			startMsg = fpT('starting_custom_build').replace('{v}', customVersion).replace('{n}', exts.length);
		}

		$('#fp_install_btn').prop('disabled', true).text(fpT('installing_btn'));
		// Log mentah instalasi sengaja tidak ditampilkan di sini lagi - progress-nya sudah
		// otomatis muncul di message box bawaan aaPanel (dibuka via messagebox() di bawah),
		// jadi cukup satu tempat saja. Di sini cukup status ringkas + polling buat tahu kapan
		// instalasi selesai (buat auto-refresh & deteksi sukses/gagal).
		$('#fp_install_status').show().text(startMsg);
		fpAjaxPost('Install', data, function (r) {
			if (!r.status) { layer.msg(r.msg, { icon: 2 }); $('#fp_install_btn').prop('disabled', false).text(fpT('install_franken_title')); $('#fp_install_status').text(''); return; }
			fpPollInstall();
			// Langsung buka panel Task bawaan aaPanel (fungsi global dari public.js) supaya
			// progress-nya kelihatan jelas, tidak perlu cari-cari ikon Task manual.
			if (typeof messagebox === 'function') messagebox();
		});
	}

	function fpPollInstall() {
		fpAjaxGet('GetInstallLog', function (d) {
			if (d.finished) {
				if (d.installed) {
					layer.msg(fpT('install_success'), { icon: 1 });
					setTimeout(fpInit, 800);
				} else {
					layer.msg(fpT('install_failed_check_log'), { icon: 2 });
					$('#fp_install_btn').prop('disabled', false).text(fpT('retry_install_btn'));
					$('#fp_install_status').text('');
				}
				return;
			}
			setTimeout(fpPollInstall, 2000);
		});
	}

	function fpHeatColor(t) {
		var c1 = [253, 230, 138], c2 = [185, 28, 28];
		var rgb = c1.map(function (v, i) { return Math.round(v + (c2[i] - v) * t); });

	function fpRenderWorldMap(countries) {
		var countByCode = {};
		countries.forEach(function (c) { countByCode[c.country] = c; });

		return Object.keys(fpCountryPaths).map(function (code) {
			var d = fpCountryPaths[code];

			var geo = fpCountryGeo[code];
			var name = geo ? geo[0] : code;
			var flag = geo && geo[3] ? geo[3] + ' ' : '';
			var fill, label;
			if (c) {
				fill = fpHeatColor(Math.min(1, c.count / maxCount));
				label = flag + name + ': ' + c.count + fpT('attacks_suffix') + ' (' + c.pct + '%)' + (c.top_ip ? ('\n' + fpT('top_ip_prefix') + c.top_ip) : '');
			} else {

	// ---- zoom & pan peta ----
	var fpGeoVB = { x: 0, y: 0, w: 1000, h: 500 };
	var fpGeoDefaultVB = { x: 0, y: 0, w: 1000, h: 500 };
	var fpGeoMinW = 40, fpGeoMaxW = 1000;

	function fpPathBBox(d) {
		var nums = (d.match(/-?\d+(\.\d+)?/g) || []).map(Number);
		var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
		for (var i = 0; i < nums.length - 1; i += 2) {
			var x = nums[i], y = nums[i + 1];
			if (x < minX) minX = x;
			if (x > maxX) maxX = x;
			if (y < minY) minY = y;
			if (y > maxY) maxY = y;
		}
		return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
	}

	function fpFocusViewBox(code) {
		var d = fpCountryPaths[code];
		if (!d) return { x: 0, y: 0, w: 1000, h: 500 };
		var b = fpPathBBox(d);
		var aspect = 1000 / 500;
		var w = (b.maxX - b.minX) * 1.8;
		var h = (b.maxY - b.minY) * 1.8;
		if (w / h > aspect) { h = w / aspect; } else { w = h * aspect; }
		w = Math.max(120, Math.min(fpGeoMaxW, w));
		h = w / aspect;
		var cx = (b.minX + b.maxX) / 2;
		var cy = (b.minY + b.maxY) / 2;
		var x = Math.max(0, Math.min(1000 - w, cx - w / 2));
		var y = Math.max(0, Math.min(500 - h, cy - h / 2));
		return { x: x, y: y, w: w, h: h };
	}

	function fpClampGeoVB() {
		fpGeoVB.w = Math.max(fpGeoMinW, Math.min(fpGeoMaxW, fpGeoVB.w));
		fpGeoVB.h = fpGeoVB.w / 2;
		fpGeoVB.x = Math.max(0, Math.min(1000 - fpGeoVB.w, fpGeoVB.x));
		fpGeoVB.y = Math.max(0, Math.min(500 - fpGeoVB.h, fpGeoVB.y));
	}

	function fpApplyGeoVB() {
		var svg = document.getElementById('fp_geo_svg');
		if (svg) svg.setAttribute('viewBox', fpGeoVB.x + ' ' + fpGeoVB.y + ' ' + fpGeoVB.w + ' ' + fpGeoVB.h);
	}

	function fpGeoZoom(factor) {
		var cx = fpGeoVB.x + fpGeoVB.w / 2;
		var cy = fpGeoVB.y + fpGeoVB.h / 2;
		fpGeoVB.w = fpGeoVB.w * factor;
		fpGeoVB.h = fpGeoVB.w / 2;
		fpGeoVB.x = cx - fpGeoVB.w / 2;
		fpGeoVB.y = cy - fpGeoVB.h / 2;
		fpClampGeoVB();
		fpApplyGeoVB();
	}

	function fpGeoReset() {
		fpGeoVB = { x: fpGeoDefaultVB.x, y: fpGeoDefaultVB.y, w: fpGeoDefaultVB.w, h: fpGeoDefaultVB.h };
		fpApplyGeoVB();
	}

	function fpBindGeoPanZoom() {
		var $svg = $('#fp_geo_svg');
		if (!$svg.length) return;
		var drag = null;
		$svg.off('.geopan').on('mousedown.geopan', function (e) {
			drag = { startX: e.clientX, startY: e.clientY, vbx: fpGeoVB.x, vby: fpGeoVB.y };
			e.preventDefault();
		});
		$(document).off('.geopan').on('mousemove.geopan', function (e) {
			if (!drag) return;
			var rect = $svg[0].getBoundingClientRect();
			if (!rect.width || !rect.height) return;
			var dx = (e.clientX - drag.startX) * (fpGeoVB.w / rect.width);
			var dy = (e.clientY - drag.startY) * (fpGeoVB.h / rect.height);
			fpGeoVB.x = drag.vbx - dx;
			fpGeoVB.y = drag.vby - dy;
			fpClampGeoVB();
			fpApplyGeoVB();
		}).on('mouseup.geopan', function () { drag = null; });
		$svg.on('wheel.geopan', function (e) {
			e.preventDefault();
			var oe = e.originalEvent;
			var rect = $svg[0].getBoundingClientRect();
			if (!rect.width || !rect.height) return;
			var factor = oe.deltaY > 0 ? 1.2 : 0.83;
			var mx = fpGeoVB.x + (oe.clientX - rect.left) / rect.width * fpGeoVB.w;
			var my = fpGeoVB.y + (oe.clientY - rect.top) / rect.height * fpGeoVB.h;
			var newW = Math.max(fpGeoMinW, Math.min(fpGeoMaxW, fpGeoVB.w * factor));
			var newH = newW / 2;
			fpGeoVB.x = mx - (mx - fpGeoVB.x) * (newW / fpGeoVB.w);
			fpGeoVB.y = my - (my - fpGeoVB.y) * (newH / fpGeoVB.h);
			fpGeoVB.w = newW;
			fpGeoVB.h = newH;
			fpClampGeoVB();
			fpApplyGeoVB();
		});
		$('#fp_geo_zoomin').off('click').on('click', function () { fpGeoZoom(0.8); });
		$('#fp_geo_zoomout').off('click').on('click', function () { fpGeoZoom(1.25); });
		$('#fp_geo_reset').off('click').on('click', fpGeoReset);
	}

			var countries = r.countries || [];

			fpGeoDefaultVB = countries.length ? fpFocusViewBox(countries[0].country) : { x: 0, y: 0, w: 1000, h: 500 };
			fpGeoVB = { x: fpGeoDefaultVB.x, y: fpGeoDefaultVB.y, w: fpGeoDefaultVB.w, h: fpGeoDefaultVB.h };

				'</div>';

			if (!countries.length) {
				// Peta kosong punya TIGA sebab yang terlihat sama persis, dan menyebut
				// ketiganya "belum ada serangan" adalah kebohongan pada dua di antaranya:
				// serangannya ada, hanya asalnya yang tak diketahui - atau database
				// GeoIP-nya memang belum terpasang sama sekali.

				} else {

				}
				$box.html(mapWrap + '<div class="fp-table-wrap" style="margin-top:12px;">' + note + '</div>');
				$('#fp_geoip_refresh').click(function () {
					var $b = $(this).prop('disabled', true).text(fpT('geoip_downloading'));
					fpAjaxPost('RefreshGeoipDatabase', {}, function (res) {
						layer.msg(fpEsc(res.msg), { icon: res.status ? 1 : 2, time: 6000 });
						if (res.status) { fpLoadGeoMap(); } else { $b.prop('disabled', false).text(fpT('geoip_download_btn')); }
					});

			}

			var rows = countries.slice(0, 12).map(function (c) {
				var geo = fpCountryGeo[c.country];
				var name = geo ? ((geo[3] ? geo[3] + ' ' : '') + geo[0]) : c.country;
				return '<tr><td>' + fpEsc(name) + '</td><td>' + c.count + '</td><td>' + c.pct + '%</td><td class="fp-mono">' + fpEsc(c.top_ip || '-') + '</td></tr>';
			}).join('');

			fpBindGeoPanZoom();
		});

	function fpFormatBytes(n) {
		if (!n) return '0 B';
		var units = ['B', 'KB', 'MB', 'GB', 'TB'];
		var i = 0;
		while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
		return n.toFixed(i ? 1 : 0) + ' ' + units[i];
	}

	function fpDatetimeLocalToEpoch(val) {
		if (!val) return '';
		var t = new Date(val).getTime();
		return isNaN(t) ? '' : Math.floor(t / 1000);
	}

	function fpWafPagination(total) {
		var pages = Math.max(1, Math.ceil(total / fpWafPageSize));
		if (pages <= 1) return '';
		var from = total ? ((fpWafPage - 1) * fpWafPageSize + 1) : 0;
		var to = Math.min(total, fpWafPage * fpWafPageSize);
		return '' +
			'<div class="fp-toolbar" style="margin-top:10px;">' +
			'<button class="btn btn-default btn-sm" id="fp_waf_page_prev"' + (fpWafPage <= 1 ? ' disabled' : '') + '>' + fpT('prev_arrow') + '</button>' +
			'<span class="fp-hint">' + fpT('showing_x_of_y').replace('{from}', from).replace('{to}', to).replace('{total}', total).replace('{page}', fpWafPage).replace('{pages}', pages) + '</span>' +
			'<button class="btn btn-default btn-sm" id="fp_waf_page_next"' + (fpWafPage >= pages ? ' disabled' : '') + '>' + fpT('next_arrow') + '</button>' +
			'</div>';
	}

	function fpRenderWafTable(protectionBox, cards, domain) {
		var total = fpWafEvents.length;
		var pages = Math.max(1, Math.ceil(total / fpWafPageSize));
		if (fpWafPage > pages) fpWafPage = pages;
		var pageEvents = fpWafEvents.slice((fpWafPage - 1) * fpWafPageSize, fpWafPage * fpWafPageSize);

		var rows = pageEvents.map(function (e) {
			var d = e.ts ? new Date(e.ts * 1000) : null;
			var waktu = d ? d.toLocaleString() : '-';
			return '<tr>' +
				'<td class="fp-mono" style="white-space:nowrap;">' + fpEsc(waktu) + '</td>' +
				'<td class="fp-mono">' + fpEsc(e.client_ip) + '</td>' +
				'<td><span class="fp-cat-badge">' + fpEsc(e.category) + '</span></td>' +
				'<td>' + fpEsc(e.message) + (e.rule_count > 1 ? ' <span class="fp-hint">' + fpT('other_rules_suffix').replace('{n}', e.rule_count - 1) + '</span>' : '') +
					// Potongan yang cocok, bukan cuma nama rule-nya. "Unix Command Injection"
					// berbunyi sama persis untuk serangan sungguhan dan untuk kolom formulir
					// yang kebetulan berisi kata GET - hanya baris inilah yang membedakannya.
					(e.matched_data ? '<div class="fp-hint fp-mono" style="margin-top:2px;word-break:break-all;">' + fpEsc(e.matched_data) + '</div>' : '') + '</td>' +
				'<td class="fp-mono" style="max-width:260px;word-break:break-all;">' + fpEsc(e.uri) + '</td>' +
				'<td>' + fpEsc(e.score) + '</td>' +
				'<td class="fp-mono" style="white-space:nowrap;">' + fpEsc(e.unique_id) + '</td>' +
				'</tr>';
		}).join('');

		var table = total ?
			'<div class="fp-table-wrap"><table class="fp-table"><thead><tr><th>' + fpT('time') + '</th><th>IP</th><th>' + fpT('category') + '</th><th>' + fpT('rule') + '</th><th>URI</th><th>' + fpT('score') + '</th><th>' + fpT('ref') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' :
			'<div class="fp-table-wrap"><div class="fp-empty">' + fpT('no_attacks_filter_domain') + '</div></div>';

		$('#fp_sec_content').html(protectionBox + cards + table + fpWafPagination(total));
		fpBindProtectionBox(domain);

		$('#fp_waf_page_prev').click(function () { fpWafPage--; fpRenderWafTable(protectionBox, cards, domain); });
		$('#fp_waf_page_next').click(function () { fpWafPage++; fpRenderWafTable(protectionBox, cards, domain); });
	}

	function fpLoadWafEvents() {
		var domain = $('#fp_sec_domain').val();
		if (!domain) return;
		$('#fp_sec_content').html('<div class="fp-hint">' + fpT('loading_waf_events') + '</div>');
		var protectionBox = fpRenderProtectionBox(domain);
		var params = {
			domain: domain,
			ip: $('#fp_sec_filter_ip').val() || '',
			ref: $('#fp_sec_filter_ref').val() || '',
			ts_from: fpDatetimeLocalToEpoch($('#fp_sec_filter_from').val()),
			ts_to: fpDatetimeLocalToEpoch($('#fp_sec_filter_to').val())
		};
		fpAjaxPost('GetWafEvents', params, function (r) {
			if (!r.status) { $('#fp_sec_content').html(protectionBox + '<div class="fp-hint">' + fpEsc(r.msg) + '</div>'); fpBindProtectionBox(domain); return; }
			var events = r.events || [];
			fpWafEvents = events;
			fpWafPage = 1;

			var byCategory = {};
			var ips = {};
			events.forEach(function (e) {
				byCategory[e.category] = (byCategory[e.category] || 0) + 1;
				if (e.client_ip) ips[e.client_ip] = true;
			});
			var topCategory = Object.keys(byCategory).sort(function (a, b) { return byCategory[b] - byCategory[a]; })[0] || '-';
			var filterActive = !!(params.ip || params.ref || params.ts_from || params.ts_to);

			var cards = '' +
				'<div class="fp-cards">' +
				'<div class="fp-card"><div class="fp-card-label">' + fpT('total_events_blocked') + '</div><div class="fp-card-value">' + events.length + '</div><div class="fp-card-sub">' + (filterActive ? fpT('filter_results_max') : fpT('last_300_events')) + '</div></div>' +
				'<div class="fp-card"><div class="fp-card-label">' + fpT('top_category') + '</div><div class="fp-card-value" style="font-size:16px;">' + fpEsc(topCategory) + '</div><div class="fp-card-sub">' + (byCategory[topCategory] || 0) + fpT('times_suffix') + '</div></div>' +
				'<div class="fp-card"><div class="fp-card-label">' + fpT('unique_attacking_ips') + '</div><div class="fp-card-value">' + Object.keys(ips).length + '</div><div class="fp-card-sub">' + fpT('in_this_period') + '</div></div>' +
				'</div>';

			fpRenderWafTable(protectionBox, cards, domain);
		});
	}

	// Rebuild = tukar binary saja, instalasi & konfigurasi situs tetap utuh.
	// Kotak centang diisi dari extension yang BENAR-BENAR ada di binary terpasang
	// (bukan preset), supaya rebuild bersifat menambah/mengurangi dari kondisi
	// berjalan dan tidak diam-diam menghilangkan extension yang sedang dipakai.
	function fpLoadRebuildPanel() {
		fpAjaxGet('GetSpcExtensionOptions', function (r) {
			if (!r.status) { $('#fp_rebuild_ext_note').text(fpT('fetch_ext_failed_prefix') + r.msg); return; }
			fpAjaxGet('GetInstalledExtensions', function (cur) {
				var active = (cur.status && cur.msg) ? cur.msg.split(',') : [];
				$('#fp_rebuild_ext_note').text(
					cur.status ? fpT('rebuild_ext_note').replace('{n}', active.length)
						: fpT('read_installed_ext_failed_ui')
				);
				$('#fp_rebuild_ext_checks').html((r.extensions || []).map(function (e) {
					return '<label><input type="checkbox" value="' + fpEsc(e) + '"' +
						(active.indexOf(e) !== -1 ? ' checked' : '') + '> ' + fpEsc(e) + '</label>';
				}).join(''));
			});
		});
	}

	function fpStartRebuild() {
		var v = $('#fp_rebuild_php_version').val().trim();
		var exts = $('#fp_rebuild_ext_checks input:checked').map(function () { return this.value; }).get();
		if (!v) { layer.msg(fpT('fill_php_version_first'), { icon: 2 }); return; }
		if (!exts.length) { layer.msg(fpT('pick_min_1_ext'), { icon: 2 }); return; }
		// aturan bentrok yang sama dengan Install - dicek di sini juga supaya user
		// tidak menunggu build 15-40 menit hanya untuk gagal di akhir.
		var pairs = [['swoole-hook-pgsql', 'pdo_pgsql'], ['swoole-hook-sqlite', 'pdo_sqlite'], ['swoole-hook-odbc', 'pdo_odbc']];
		for (var i = 0; i < pairs.length; i++) {
			if (exts.indexOf(pairs[i][0]) !== -1 && exts.indexOf(pairs[i][1]) !== -1) {
				layer.msg(fpT('ext_conflict').replace('{hook}', pairs[i][0]).replace('{pdo}', pairs[i][1]), { icon: 2 });
				return;
			}
		}
		layer.confirm(fpT('confirm_rebuild').replace('{v}', v).replace('{n}', exts.length),
			{ icon: 3, title: fpT('confirmation_title'), btn: [fpT('rebuild_btn'), fpT('cancel')] }, function (idx) {
			layer.close(idx);
			$('#fp_rebuild_btn').prop('disabled', true).text(fpT('installing_btn'));
			$('#fp_rebuild_status').show().text(fpT('starting_custom_build').replace('{v}', v).replace('{n}', exts.length));
			fpAjaxPost('Rebuild', { custom_php_version: v, extensions: exts.join(',') }, function (r) {
				if (!r.status) {
					layer.msg(r.msg, { icon: 2 });
					$('#fp_rebuild_btn').prop('disabled', false).text(fpT('rebuild_btn'));
					$('#fp_rebuild_status').hide();
					return;
				}
				layer.msg(r.msg, { icon: 1 });
				if (typeof messagebox === 'function') messagebox();
			});
		});
	}

	function fpUninstallPlugin() {
		layer.confirm(fpT('confirm_uninstall_warning'), { icon: 3, title: fpT('confirmation_title'), btn: [fpT('confirm_uninstall_btn'), fpT('cancel')] }, function (idx) {
			layer.close(idx);
			var loadT = layer.msg(fpT('uninstalling'), { icon: 16, time: 0 });
			fpAjaxPost('Uninstall', {}, function (r) {
				layer.close(loadT);
				layer.msg(r.msg, { icon: r.status ? 1 : 2, time: 4000 });
				if (r.status) { setTimeout(fpInit, 1000); }
			});
		});
	}

	// ---------------- WAF custom-rule builder (Simple/Advanced) ----------------
	// Mode Simple murni lapisan UI di atas textarea raw yang sudah ada (#fp_s_waf_custom) -
	// backend TIDAK berubah sama sekali, tetap terima/validasi teks SecRule biasa. Kartu
	// men-generate teks yang sama persis yang sebelumnya harus diketik manual, dan bisa
	// mem-parse balik teks itu jadi kartu (best-effort - baris yang tidak cocok pola generate
	// kita sendiri otomatis jadi 1 kartu "raw" gabungan di akhir, tetap ikut kesimpan, tidak
	// pernah hilang diam-diam - cuma urutan relatif ke rule terstruktur lain tidak dijamin).
	var fpWafRuleTemplates = [
		{ v: 'user_agent', labelKey: 'waf_rule_tpl_user_agent', target: 'REQUEST_HEADERS:User-Agent', hasName: false },
		{ v: 'header', labelKey: 'waf_rule_tpl_header', target: 'REQUEST_HEADERS:', hasName: true, namePlaceholderKey: 'waf_rule_header_name_placeholder' },
		{ v: 'uri', labelKey: 'waf_rule_tpl_uri', target: 'REQUEST_URI', hasName: false },
		{ v: 'arg', labelKey: 'waf_rule_tpl_arg', target: 'ARGS:', hasName: true, namePlaceholderKey: 'waf_rule_arg_name_placeholder' }
	];
	var fpWafRuleOps = ['contains', 'equals', 'starts_with', 'regex'];
	var fpWafRuleActions = ['deny', 'log'];
	var fpWafRules = [];

	function fpWafRuleTemplateByValue(v) {
		for (var i = 0; i < fpWafRuleTemplates.length; i++) if (fpWafRuleTemplates[i].v === v) return fpWafRuleTemplates[i];
		return null;
	}
	function fpRegexEscape(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
	function fpWafEscValue(v) { return String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }
	function fpWafUnescValue(v) { return String(v).replace(/\\(.)/g, '$1'); }

	function fpWafRuleTarget(rule) {
		var tpl = fpWafRuleTemplateByValue(rule.template);
		if (!tpl) return null;
		return tpl.hasName ? (tpl.target + (rule.name || '')) : tpl.target;
	}

	function fpWafRuleToText(rule) {
		if (rule.template === 'raw') return rule.raw || '';
		var target = fpWafRuleTarget(rule);
		if (!target || !rule.value || (fpWafRuleTemplateByValue(rule.template).hasName && !rule.name)) return '';
		var val = rule.op === 'starts_with' ? '^' + fpRegexEscape(rule.value) : rule.value;
		var opPrefix = rule.op === 'contains' ? '@contains ' : rule.op === 'equals' ? '@streq ' : '@rx ';
		var action = rule.action === 'log' ? 'pass,log' : 'deny,status:403,log';
		return 'SecRule ' + target + ' "' + opPrefix + fpWafEscValue(val) + '" "id:' + rule.id + ',' + action + '"';
	}

	var fpWafRuleLineRe = /^SecRule\s+(REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:([^\s"]+)|REQUEST_URI|ARGS:([^\s"]+))\s+"(@contains|@streq|@rx)\s((?:[^"\\]|\\.)*)"\s+"id:(\d+),(deny,status:403|pass),log"\s*$/;

	function fpWafParseLine(line) {
		var m = line.match(fpWafRuleLineRe);
		if (!m) return null;
		var targetFull = m[1], headerName = m[2], argName = m[3], op = m[4], rawVal = m[5], id = m[6], actionPart = m[7];
		var template, name = '';
		if (targetFull === 'REQUEST_HEADERS:User-Agent') { template = 'user_agent'; }
		else if (headerName) { template = 'header'; name = headerName; }
		else if (targetFull === 'REQUEST_URI') { template = 'uri'; }
		else if (argName) { template = 'arg'; name = argName; }
		else return null;
		var unesc = fpWafUnescValue(rawVal);
		var opKey, value = unesc;
		if (op === '@contains') opKey = 'contains';
		else if (op === '@streq') opKey = 'equals';
		else {
			// @rx bisa jadi hasil generate kita sendiri buat "starts with" (^ + fpRegexEscape(literal))
			// ATAU regex asli yang diketik manual user yang KEBETULAN diawali ^ (anchor beneran) -
			// dua-duanya sama persis bentuknya secara tekstual, jadi TIDAK bisa dibedakan cuma dari
			// "diawali ^". Satu-satunya cara aman: cek apakah sisi kanan ^ itu PERSIS bisa dihasilkan
			// dari fpRegexEscape(suatu literal) - kalau reversible sempurna, aman dianggap starts_with
			// kita; kalau tidak (ada metachar regex asli yang tidak match pola escape kita), HARUS
			// dianggap regex biasa apa adanya - jangan coba "unescape" sepihak (itu yang bikin bug:
			// literal seperti \d di ^[A-Z]{3}\d+$ kepotong jadi d, merusak regex asli user).
			opKey = 'regex';
			if (unesc.charAt(0) === '^') {
				var literal = unesc.slice(1).replace(/\\([.*+?^${}()|[\]\\])/g, '$1');
				if (fpRegexEscape(literal) === unesc.slice(1)) { opKey = 'starts_with'; value = literal; }
			}
		}
		return { id: parseInt(id, 10), template: template, name: name, op: opKey, value: value, action: actionPart === 'pass' ? 'log' : 'deny' };
	}

	function fpWafParseRules(text) {
		var lines = (text || '').split('\n');
		var rules = [], rawBuffer = [];
		lines.forEach(function (line) {
			var trimmed = line.trim();
			if (!trimmed) return;
			var parsed = fpWafParseLine(trimmed);
			if (parsed) rules.push(parsed); else rawBuffer.push(line);
		});
		if (rawBuffer.length) rules.push({ template: 'raw', raw: rawBuffer.join('\n') });
		return rules;
	}

	function fpWafNextRuleId(rules) {
		var max = 1000000;
		rules.forEach(function (r) { if (r.id && r.id >= max) max = r.id + 1; });
		return max;
	}

	function fpRenderWafRuleCard(rule, idx) {
		if (rule.template === 'raw') {
			return '<div class="fp-waf-rule-card" data-idx="' + idx + '" style="border:1px dashed #d8dce2;border-radius:6px;padding:10px;margin-bottom:8px;">' +
				'<div class="fp-hint" style="margin-bottom:6px;">' + fpT('waf_rule_unrecognized') + '</div>' +
				'<pre class="fp-mono" style="background:#f5f6f8;padding:8px;border-radius:6px;font-size:12px;white-space:pre-wrap;margin:0;">' + fpEsc(rule.raw) + '</pre>' +
				'</div>';
		}
		var tpl = fpWafRuleTemplateByValue(rule.template) || fpWafRuleTemplates[0];
		var templateOptions = fpWafRuleTemplates.map(function (t) {
			return '<option value="' + t.v + '"' + (t.v === rule.template ? ' selected' : '') + '>' + fpT(t.labelKey) + '</option>';
		}).join('');
		var opOptions = fpWafRuleOps.map(function (op) {
			return '<option value="' + op + '"' + (op === rule.op ? ' selected' : '') + '>' + fpT('waf_rule_op_' + op) + '</option>';
		}).join('');
		var actionOptions = fpWafRuleActions.map(function (a) {
			return '<option value="' + a + '"' + (a === rule.action ? ' selected' : '') + '>' + fpT('waf_rule_action_' + a) + '</option>';
		}).join('');
		var nameField = tpl.hasName
			? '<input class="fp-input fp-waf-rule-name" type="text" value="' + fpEsc(rule.name || '') + '" placeholder="' + fpT(tpl.namePlaceholderKey) + '" style="max-width:220px;margin-right:6px;">'
			: '';
		return '' +
			'<div class="fp-waf-rule-card" data-idx="' + idx + '" style="border:1px solid #eceff2;border-radius:6px;padding:10px;margin-bottom:8px;">' +
			'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">' +
			'<select class="fp-select fp-waf-rule-template" style="max-width:260px;">' + templateOptions + '</select>' +
			'<span class="fp-hint fp-waf-rule-id">' + fpT('waf_rule_id_label') + ' ' + rule.id + '</span>' +
			'<button type="button" class="btn btn-danger btn-sm fp-waf-rule-delete">' + fpT('waf_rule_delete_btn') + '</button>' +
			'</div>' +
			'<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;">' +
			nameField +
			'<select class="fp-select fp-waf-rule-op" style="max-width:190px;">' + opOptions + '</select>' +
			'<input class="fp-input fp-waf-rule-value" type="text" value="' + fpEsc(rule.value || '') + '" placeholder="' + fpT('waf_rule_value_placeholder') + '" style="flex:1;min-width:150px;">' +
			'</div>' +
			'<div style="margin-bottom:6px;"><select class="fp-select fp-waf-rule-action" style="max-width:200px;">' + actionOptions + '</select></div>' +
			'<details><summary class="fp-hint" style="cursor:pointer;">' + fpT('waf_rule_preview_toggle') + '</summary>' +
			'<pre class="fp-mono fp-waf-rule-preview" style="background:#1a1d24;color:#d3d7de;padding:8px;border-radius:6px;font-size:11px;white-space:pre-wrap;margin-top:4px;">' + fpEsc(fpWafRuleToText(rule)) + '</pre></details>' +
			'</div>';
	}

	function fpRenderWafCustomRuleBuilder(rawText) {
		return '' +
			'<div class="fp-waf-rule-builder" id="fp_waf_rule_builder">' +
			'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
			'<div class="fp-form-label" style="margin:0;">' + fpT('custom_rule') + '</div>' +
			fpSeg('fp_waf_rule_mode', [{ v: 'simple', t: fpT('waf_rule_mode_simple') }, { v: 'advanced', t: fpT('waf_rule_mode_advanced') }], 'simple') +

			'<textarea class="fp-textarea" id="fp_s_waf_custom" style="display:none;margin-top:8px;" placeholder="' + fpT('custom_rule_placeholder') + '">' + fpEsc(rawText) + '</textarea>' +
			'<div class="fp-hint" style="margin-top:4px;">' + fpT('custom_rule_hint') + '</div>' +
			'</div>';

	function fpWafRuleBuilderSync() {
		var text = fpWafRules.map(fpWafRuleToText).filter(function (t) { return t; }).join('\n');
		$('#fp_s_waf_custom').val(text);
	}

	function fpWafRuleBuilderRenderCards() {
		var $cards = $('#fp_waf_rule_cards');
		$cards.html(fpWafRules.length ? fpWafRules.map(fpRenderWafRuleCard).join('') : '<div class="fp-hint">' + fpT('waf_rule_empty') + '</div>');
		fpWafRuleBuilderSync();
		fpFixLayerBox($('#fp_plugin').closest('.layui-layer'));
	}

	function fpWafRuleBuilderBind() {
		fpWafRules = fpWafParseRules($('#fp_s_waf_custom').val());
		fpWafRuleBuilderRenderCards();

		$('#fp_waf_rule_add').off('click').on('click', function () {
			fpWafRules.push({ id: fpWafNextRuleId(fpWafRules), template: 'user_agent', name: '', op: 'contains', value: '', action: 'deny' });
			fpWafRuleBuilderRenderCards();
		});
		$('#fp_waf_rule_cards').off('click', '.fp-waf-rule-delete').on('click', '.fp-waf-rule-delete', function () {
			fpWafRules.splice($(this).closest('.fp-waf-rule-card').data('idx'), 1);
			fpWafRuleBuilderRenderCards();
		});
		$('#fp_waf_rule_cards').off('change', '.fp-waf-rule-template').on('change', '.fp-waf-rule-template', function () {
			var idx = $(this).closest('.fp-waf-rule-card').data('idx');
			fpWafRules[idx].template = $(this).val();
			fpWafRules[idx].name = '';
			fpWafRuleBuilderRenderCards();
		});
		$('#fp_waf_rule_cards').off('input change', '.fp-waf-rule-name, .fp-waf-rule-value').on('input change', '.fp-waf-rule-name, .fp-waf-rule-value', function () {
			var idx = $(this).closest('.fp-waf-rule-card').data('idx');
			var field = $(this).hasClass('fp-waf-rule-name') ? 'name' : 'value';
			fpWafRules[idx][field] = $(this).val();
			$(this).closest('.fp-waf-rule-card').find('.fp-waf-rule-preview').text(fpWafRuleToText(fpWafRules[idx]));
			fpWafRuleBuilderSync();
		});
		$('#fp_waf_rule_cards').off('change', '.fp-waf-rule-op, .fp-waf-rule-action').on('change', '.fp-waf-rule-op, .fp-waf-rule-action', function () {
			var idx = $(this).closest('.fp-waf-rule-card').data('idx');
			var field = $(this).hasClass('fp-waf-rule-op') ? 'op' : 'action';
			fpWafRules[idx][field] = $(this).val();
			$(this).closest('.fp-waf-rule-card').find('.fp-waf-rule-preview').text(fpWafRuleToText(fpWafRules[idx]));
			fpWafRuleBuilderSync();
		});
		$('#fp_waf_rule_mode .fp-seg-opt').off('click').on('click', function () {
			var mode = $(this).data('val');
			$('#fp_waf_rule_mode .fp-seg-opt').removeClass('sel');
			$(this).addClass('sel');
			if (mode === 'advanced') {
				fpWafRuleBuilderSync();
				$('#fp_waf_rule_cards, #fp_waf_rule_add').hide();
				$('#fp_s_waf_custom').show();
			} else {
				fpWafRules = fpWafParseRules($('#fp_s_waf_custom').val());
				$('#fp_s_waf_custom').hide();
				$('#fp_waf_rule_cards, #fp_waf_rule_add').show();
				fpWafRuleBuilderRenderCards();
			}
			fpFixLayerBox($('#fp_plugin').closest('.layui-layer'));
		});
	}

	function fpSiteForm(site) {
		var isEdit = !!site;
		var mode = site ? (site.mode || 'php') : 'php';
		var domainVal = site ? site.domain : '';
		var rootVal = site ? (site.root || '') : '';
		var backendsVal = site && site.backends ? site.backends.join('\n') : '';
		var policyVal = site ? (site.lb_policy || 'round_robin') : 'round_robin';
		var emailVal = site ? (site.email || '') : '';
		var forceHttpsVal = site ? !!site.force_https : false;
		var workerEnabledVal = site ? !!site.worker_enabled : false;
		var workerScriptVal = site ? (site.worker_script || '') : '';
		var workerNumVal = site ? (site.worker_num || 4) : 4;
		var workerEnvVal = site && site.worker_env ? Object.keys(site.worker_env).map(function (k) { return k + '=' + site.worker_env[k]; }).join('\n') : '';
		var workerTypeVal = site ? (site.worker_type || 'embedded') : 'embedded';
		var workerPortVal = site ? (site.worker_port || '') : '';
		var wafEngineVal = site ? (site.waf_engine || 'on') : 'on';
		var wafParanoiaVal = site ? (site.waf_paranoia || 1) : 1;

	function fpCheckHealthInDialog(domain) {
		var $box = $('#fp_health_results');
		$box.html('<span class="fp-hint">' + fpT('checking') + '</span>');
		fpAjaxPost('CheckBackendHealth', { domain: domain }, function (r) {
			if (!r.status) { $box.html('<span class="fp-hint">' + fpEsc(r.msg) + '</span>'); return; }
			var html = r.results.map(function (item) {
				return '<div class="fp-health-row"><span class="fp-health-dot ' + (item.healthy ? 'up' : 'down') + '"></span>' +
					'<span class="fp-health-backend">' + fpEsc(item.backend) + '</span>' +
					'<span class="fp-health-meta">' + (item.healthy ? ('OK &middot; HTTP ' + item.code + ' &middot; ' + item.time_ms + 'ms') : ('DOWN' + (item.code ? (' &middot; HTTP ' + item.code) : ' &middot; ' + fpT('not_responding')))) + '</span></div>';
			}).join('');
			$box.html(html);
			fpFixLayerBox($('#fp_plugin').closest('.layui-layer'));
		});
	}

	function fpSiteFormSubmit(isEdit, originalDomain) {
		var domain = isEdit ? originalDomain : $('#fp_s_domain').val().trim();
		if (!domain) { layer.msg(fpT('domain_required'), { icon: 2 }); return; }
		var mode = $('#fp_s_mode').val();
		var data = { domain: domain, mode: mode, email: $('#fp_s_email').val(), force_https: $('#fp_s_force_https').is(':checked') ? '1' : '0' };
		if (mode === 'waf_proxy') {
			data.backends = $('#fp_s_backends').val();
			data.lb_policy = $('#fp_s_policy').val();
			data.health_uri = $('#fp_s_health_uri').val();
			data.health_interval = $('#fp_s_health_interval').val();
			data.backend_tls = $('#fp_s_backend_tls').is(':checked') ? '1' : '0';
			data.backend_tls_insecure = $('#fp_s_backend_tls_insecure').is(':checked') ? '1' : '0';
			data.backend_tls_server_name = $('#fp_s_backend_tls_server_name').val();
		} else {
			data.root = $('#fp_s_root').val();
			data.worker_enabled = $('#fp_s_worker_enabled').is(':checked') ? '1' : '0';
			data.worker_type = $('#fp_s_worker_type .fp-seg-opt.sel').data('val') || 'embedded';
			data.worker_script = $('#fp_s_worker_script').val();
			data.worker_num = $('#fp_s_worker_num').val();
			data.worker_env = $('#fp_s_worker_env').val();
		}
		if (mode === 'waf_php' || mode === 'waf_proxy') {
			data.waf_engine = $('#fp_s_waf_engine .fp-seg-opt.sel').data('val') || 'on';
			data.waf_paranoia = $('#fp_s_waf_paranoia').val();
			data.waf_threshold = $('#fp_s_waf_threshold').val();
			data.waf_custom_rules = $('#fp_s_waf_custom').val();
			data.waf_allowed_methods = $('#fp_s_waf_methods input:checked').map(function () { return this.value; }).get().join(',');
			data.waf_whitelist = $('#fp_s_waf_whitelist').val();
			data.waf_bypass_paths = $('#fp_s_waf_bypass_paths').val();
			data.waf_blacklist = $('#fp_s_waf_blacklist').val();
			data.waf_upload_filter_enabled = $('#fp_s_upload_filter_enabled').is(':checked') ? '1' : '0';
			data.waf_upload_filter_mode = $('#fp_s_upload_filter_mode .fp-seg-opt.sel').data('val') || 'blacklist';
			data.waf_upload_filter_list = $('#fp_s_upload_filter_list').val();
			data.cc_enabled = $('#fp_s_cc_enabled').is(':checked') ? '1' : '0';
			data.cc_threshold = $('#fp_s_cc_threshold').val();
			data.cc_window = $('#fp_s_cc_window').val();
			data.waf_autoblock_enabled = $('#fp_s_waf_autoblock_enabled').is(':checked') ? '1' : '0';
			data.waf_autoblock_threshold = $('#fp_s_waf_autoblock_threshold').val();
			data.waf_autoblock_window = $('#fp_s_waf_autoblock_window').val();
		}
		var loadT = layer.msg(isEdit ? fpT('saving_restart') : fpT('adding_domain'), { icon: 16, time: 0 });
		fpAjaxPost(isEdit ? 'UpdateSite' : 'AddSite', data, function (r) {
			layer.close(loadT);
			layer.msg(r.msg, { icon: r.status ? 1 : 2, time: 5000 });
			if (r.status) { fpState = r; fpActiveTab = 'domains'; fpRenderManage(); }
		});
	}

	function fpRemoveSite(domain) {
		layer.confirm(fpT('confirm_delete_domain').replace('{domain}', domain), { icon: 3, title: fpT('confirmation_title') }, function (idx) {
			layer.close(idx);
			var loadT = layer.msg(fpT('deleting'), { icon: 16, time: 0 });
			fpAjaxPost('RemoveSite', { domain: domain }, function (r) {
				layer.close(loadT);
				layer.msg(r.msg, { icon: r.status ? 1 : 2 });
				if (r.status) { fpState = r; fpRenderManage(); }
			});
		});
	}

	// ---------------- service control / settings ----------------

	function fpControl(action) {
		var loadT = layer.msg(fpT('processing'), { icon: 16, time: 0 });
		fpAjaxPost(action, {}, function (d) {
			layer.close(loadT);
			fpState = d;
			fpRenderManage();
		});
	}

	function fpSaveConfig() {
		var data = { port: $('#fp_cfg_port').val(), root: $('#fp_cfg_root').val() };
		var loadT = layer.msg(fpT('saving'), { icon: 16, time: 0 });
		fpAjaxPost('SetConfig', data, function (r) {
			layer.close(loadT);
			layer.msg(r.msg, { icon: r.status ? 1 : 2, time: 4000 });
			if (r.status) { fpState = r; fpRenderManage(); }
		});
	}

	fpInit();
</script>
